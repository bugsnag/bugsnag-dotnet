image: Visual Studio 2022
install:
  - set PATH=C:\Ruby25-x64\bin;%PATH%
build_script:
  - ps: .\build.ps1 --target Appveyor
after_build:
  - ps: 7z a build\bugsnag.zip build\Release\**\Bugsnag*.dll build\Release\**\Bugsnag*.pdb
test: off
artifacts:
  - path: 'build\packages\*.*nupkg'
  - path: 'build\bugsnag.zip'
deploy:
  - provider: NuGet
    api_key:
      secure: ZOltiJQYBDnQdQxzM3eROvsQo5RB4INOv6RqUPtE+j7E2HbdKqI6SNX7h3YxNNkO 
    skip_symbols: false
    symbol_server: https://www.nuget.org/api/v2/symbolpackage
    artifact: /.*(\.|\.s)nupkg/
    on:
      appveyor_repo_tag: true

